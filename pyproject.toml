[project]
name = "plancliff"
version = "0.1.0"
description = "Find the PostgreSQL queries that become hundreds of times slower once Postgres switches to a generic plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rachid Jeffali", email = "rachidj@protonmail.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "pglast>=8.9",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
plancliff = "plancliff.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
