name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run ruff check src tests

  test:
    name: postgres ${{ matrix.postgres }} · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
        python: ["3.12"]
        include:
          - { postgres: "17", python: "3.11" }
          - { postgres: "17", python: "3.13" }
    env:
      PLANCLIFF_TEST_DSN: postgresql://postgres:p@localhost:5432/postgres
      PLANCLIFF_TEST_STATS_DSN: postgresql://postgres:p@localhost:5432/postgres
      PLANCLIFF_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      # Service containers cannot pass server options, and pg_stat_statements must be preloaded.
      - name: Start Postgres ${{ matrix.postgres }} with pg_stat_statements
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=p -p 5432:5432 \
            postgres:${{ matrix.postgres }}-alpine -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 1
          done
          docker logs pg
          exit 1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -v
